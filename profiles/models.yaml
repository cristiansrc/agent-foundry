# Perfil de Modelos — agent-foundry
# ÚNICO lugar donde se declaran modelos concretos por proveedor.
# Los agentes viven en core/ agnósticos; este archivo los une a un modelo real.
# Cambiar de modelo/proveedor = editar aquí + tooling/build.sh.
schema: foundry/profiles/models/v2
updated: 2026-09-10

# ── 1. Tiers abstractos (capacidad requerida, sin marcas) ──────────────────
tiers:
  orchestration:        {desc: Orquestación superior y contexto global}
  macro_architecture:   {desc: Arquitectura enterprise, System Landscape}
  patterns_logic:       {desc: Patrones GoF, razonamiento denso}
  planning_governance:  {desc: Planificación, gobernanza OpenAPI, descomposición}
  spec_validation_critical: {desc: Validación crítica e independiente de specs}
  sdd_validation:       {desc: Validación SDD, remediación, curación, QA final}
  code_volume:          {desc: Ejecución de volumen (implementación, tests, git)}
  code_heavy:           {desc: Código pesado, refactor, DB, RCA}
  ui_e2e:               {desc: Pruebas funcionales UI/E2E}

# ── 2. Agente → tier ───────────────────────────────────────────────────────
# (temperature y permisos viven en permissions.yaml)
agent_tiers:
  # OpenCode es el harness; `harness_provider` elige la suscripción que paga
  # la inferencia. Luna jamás se consume desde OpenCode Go.
  master-orchestrator:    {tier: orchestration, harness_provider: harness_chatgpt}
  hyprmind-orchestrator:  {tier: orchestration}
  hyprmind-deep-thinker:  {tier: orchestration}
  hyprmind-vision-analyst: {tier: orchestration, requires: vision}
  general:                {tier: orchestration}
  enterprise-architect:   {tier: macro_architecture, harness_provider: harness_chatgpt}
  solution-architect:     {tier: patterns_logic, harness_provider: harness_chatgpt}
  ui-designer:            {tier: patterns_logic}
  planner:                {tier: planning_governance, harness_provider: harness_chatgpt}
  api-governance-agent:   {tier: planning_governance}
  task-decomposer:        {tier: planning_governance}
  spec-validator:         {tier: spec_validation_critical, harness_provider: opencode, locked: true}
  enterprise-spec-validator: {tier: spec_validation_critical, harness_provider: opencode}
  spec-remediator:        {tier: sdd_validation}
  context-curator:        {tier: sdd_validation}
  reviewer:               {tier: sdd_validation}
  security-reviewer:      {tier: code_heavy, harness_provider: harness_chatgpt}
  requirements-analyst:   {tier: sdd_validation, harness_provider: harness_chatgpt}
  final-validation:       {tier: sdd_validation, harness_provider: harness_chatgpt}
  documentation:          {tier: sdd_validation}
  executor:               {tier: code_heavy}
  test-architect:         {tier: code_volume}
  devops-architect:       {tier: code_volume}
  git-executor:           {tier: sdd_validation}
  refactor:               {tier: code_heavy}
  database-architect:     {tier: code_heavy}
  bug-diagnostician:      {tier: code_heavy, harness_provider: harness_chatgpt}
  architect-executor:     {tier: code_heavy}
  functional-tester-agent: {tier: ui_e2e}

# ── 3. Bindings por proveedor/herramienta ──────────────────────────────────
providers:
  opencode:
    active: true
    models:
      glm_flash:
        id: opencode-go/glm-5.3-flash
        status: active
        context: 1M
        vision: true
        cost: 0.075/0.25
        notes: Ganga 2026-08 — 0.075 input, fuerte en specs y arquitectura. macro_architecture.
      glm_reasoning:
        id: opencode-go/glm-5.3
        status: active
        context: 1M
        vision: false
        cost: 1.40/4.40
        notes: Validador crítico de specs. Sin entrenamiento ni retención según la tabla de privacidad de OpenCode Go (verificado 2026-09-10).
      deepseek_v41_flash:
        id: opencode-go/deepseek-v4.1-flash
        status: active
        context: 1M
        vision: false
        cost: 0.15/0.60
        notes: Código de alto volumen. Sin entrenamiento ni retención según la tabla de privacidad de OpenCode Go (verificado 2026-09-10).
      deepseek_flash_vision:
        id: opencode-go/deepseek-v4-flash-vision-exp
        status: active
        context: 1M
        vision: true
        cost: 0.15/0.60
        notes: UI/E2E con visión. Sin entrenamiento ni retención según la tabla de privacidad de OpenCode Go (verificado 2026-09-10).
      longcat:
        id: opencode-go/longcat-2.0
        status: active
        context: 1M
        vision: false
        cost: 0.30/1.20
        notes: Plan Go económico-mid. Planning/gobernanza estructurada, descomposición determinista.
      mimo_v25:
        id: opencode-go/mimo-v2.5
        status: active
        context: 1M
        vision: true
        cost: 0.14/0.28
        notes: Equilibrado mid-barato. Patrones GoF y validación SDD — 0.14 input, 1M ctx.
      hy3:
        id: opencode-go/hy3
        status: active
        context: 256k
        vision: false
        cost: 0.0175/0.0725
        notes: Más barato Go (0.017 input). Sin vision — no apto para ui_e2e con captura.
    tier_bindings:
      orchestration:       [mimo_v25]
      macro_architecture:  [glm_flash]
      patterns_logic:      [mimo_v25]
      planning_governance: [longcat]
      spec_validation_critical: [glm_reasoning]
      sdd_validation:      [mimo_v25]
      code_volume:         [deepseek_v41_flash]
      code_heavy:          [deepseek_v41_flash]
      ui_e2e:              [deepseek_flash_vision]
    fallbacks:
      deepseek_v41_flash: [glm_flash]
      deepseek_flash_vision: [glm_flash]
      hy3:           [glm_flash]
      mimo_v25:      [glm_flash]
      longcat:       [mimo_v25]
      glm_flash:     [deepseek_v41_flash]
      # Luna se consume exclusivamente a través de OAuth de ChatGPT.

  # Usado únicamente por el adapter OpenCode para modelos autenticados con
  # ChatGPT Plus/Pro. Los IDs requieren verificar `/models` tras `/connect`.
  harness_chatgpt:
    active: true
    models:
      luna:
        id: openai/gpt-5.6-luna
        status: active
        context: 272K
        vision: true
        notes: Planificación, validación y arbitraje de alto valor.
      terra:
        id: openai/gpt-5.6-terra
        status: active
        context: 272K
        vision: true
        notes: Arquitectura, seguridad y RCA de alto riesgo.
      sol:
        id: openai/gpt-5.6-sol
        status: active
        context: 272K
        vision: true
        notes: Planificación y decisiones de alta complejidad vía ChatGPT OAuth.
    tier_bindings:
      orchestration:       [terra]
      macro_architecture:  [terra]
      patterns_logic:      [terra]
      planning_governance: [sol]
      spec_validation_critical: [sol]
      sdd_validation:      [luna]
      code_volume:         [luna]
      code_heavy:          [terra]
      ui_e2e:              [luna]
    fallbacks:
      luna: [terra]
      terra: []

  chatgpt:
    active: true
    models:
      sol:
        id: gpt-5.6-sol
        status: active
        context: 272K
        vision: true
        cost: 2.4x
        notes: Flagship. Orquestación superior, vision, tareas que requieren razonamiento denso.
      terra:
        id: gpt-5.6-terra
        status: active
        context: 272K
        vision: true
        cost: 1.0x
        notes: Equilibrado. Arquitectura, código pesado, validación SDD.
      luna:
        id: gpt-5.6-luna
        status: active
        context: 272K
        vision: true
        cost: 0.1x
        notes: Rápido y barato. Ejecución SDD, review, docs, curación, gobernanza.
    tier_bindings:
      orchestration:       [sol]
      macro_architecture:  [terra]
      patterns_logic:      [terra]
      planning_governance: [luna]
      sdd_validation:      [luna]
      code_volume:         [luna]
      code_heavy:          [terra]
      ui_e2e:              [luna]
    fallbacks:
      sol:  [terra]
      terra: [luna]
      luna: []

  kiro:
    active: true
    models:
      opus5:
        id: claude-opus-5
        status: active
        context: 1M
        vision: true
        cost: 2.2x
        notes: Jul 2026. Solo orquestación/vision. El más caro — reservar donde importa.
      sonnet5:
        id: claude-sonnet-5
        status: active
        context: 1M
        vision: true
        cost: 1.3x
        notes: Jun 2026. Sweet spot razonamiento/costo. Arquitectura y patrones.
      haiku45:
        id: claude-haiku-4.5
        status: active
        context: 200K
        vision: false
        cost: 0.4x
        notes: Validación SDD, review, docs, curación. 3x más barato que Sonnet.
      qwen3_coder:
        id: qwen3-coder-next
        status: experimental
        context: 256K
        vision: false
        cost: 0.05x
        notes: Feb 2026. Solo us-east-1. 26x más barato que Sonnet; ideal con SDD — sigue specs al pie de la letra.
      gpt56_luna:
        id: gpt-5.6-luna
        status: experimental
        context: 272K
        vision: true
        cost: 0.1x
        notes: Jul 2026. En Kiro vía OpenAI. 13x más barato que Sonnet; planning/gobernanza estructurada y validación ligera.
      gpt56_terra:
        id: gpt-5.6-terra
        status: experimental
        context: 272K
        vision: true
        cost: 1.0x
        notes: Jul 2026. Balance en Kiro. Alternativa a Sonnet para código pesado si Qwen falla.
    tier_bindings:
      orchestration:       [opus5]
      macro_architecture:  [sonnet5]
      patterns_logic:      [sonnet5]
      planning_governance: [gpt56_luna]
      sdd_validation:      [haiku45]
      code_volume:         [qwen3_coder]
      code_heavy:          [gpt56_terra]
      ui_e2e:              [qwen3_coder]
    fallbacks:
      opus5:       [sonnet5]
      sonnet5:     [haiku45, gpt56_terra]
      gpt56_luna:  [haiku45]
      haiku45:     [gpt56_luna]
      qwen3_coder: [haiku45, gpt56_terra]
      gpt56_terra: [sonnet5]

