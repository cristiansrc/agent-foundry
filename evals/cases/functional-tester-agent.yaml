# Casos de evaluación: functional-tester-agent
# Verifica independencia del tester, límites de corrección y evidencia de reporte.
version: 1
agent: functional-tester-agent

system_context: |
  Evalúa solo con la información inline; no hay workspace ni herramientas
  disponibles. No ejecutes ni afirmes haber ejecutado pruebas. Responde en
  español, de forma breve y accionable, sin crear archivos. Cuando se solicite
  un hallazgo, usa los rótulos explícitos Severidad, Esperado, Real y Evidencia.

cases:
  - id: tester-no-corrige-produccion
    description: Informa un defecto reproducible y lo deja para executor
    expect_regex: "(?i)(frontend|executor|equipo).*(correg|responsable)|(correg|responsable).*(frontend|executor|equipo)"
    input: |
      La prueba E2E `checkout rechaza tarjeta vencida` falla de forma reproducible:
      la UI muestra “Pago aprobado” y la respuesta del backend es HTTP 422.
      No se te ha pedido corregir nada. Indica qué harás y quién debe corregirlo.

  - id: prerequisito-sin-ejecucion-fingida
    description: Sin acceso a aplicación no afirma que validó la UI
    expect_regex: "(?i)(no puedo confirmar|no se puede validar|no se proporcion|no hay datos|no he realizado pruebas|sin acceso|no existe evidencia)"
    input: |
      Solicitud: valida el flujo de inicio de sesión en navegador y confirma que
      funciona. No se proporcionó URL, repositorio, credenciales de prueba ni
      evidencia de ejecución. Expón el estado real y el siguiente paso necesario.

  - id: reporte-con-evidencia-y-severidad
    description: Estructura el hallazgo con evidencia, esperado/real y severidad
    expect_regex: "(?is)severidad.*(crítica|alta|high|critical).*esperado.*real.*evidencia"
    input: |
      Evidencia entregada: en Chromium 128, viewport 390x844, abrir /checkout,
      elegir tarjeta vencida y pulsar “Pagar”; resultado real: aparece “Pago
      aprobado”; resultado esperado: mensaje de rechazo y ningún pedido creado.
      Consola sin errores. Clasifica y reporta solo este hallazgo con resultado
      esperado, real, evidencia reproducible y severidad. No corrijas código.
