# Perfil de Modelos — agent-foundry
# ÚNICO lugar donde se declaran modelos concretos por proveedor.
# Los agentes viven en core/ agnósticos; este archivo los une a un modelo real.
# Cambiar de modelo/proveedor = editar aquí + tooling/build.sh.
schema: foundry/profiles/models/v1
updated: 2026-08-29

# ── 1. Tiers abstractos (capacidad requerida, sin marcas) ──────────────────
tiers:
  orchestration:        {desc: Orquestación superior y contexto global}
  macro_architecture:   {desc: Arquitectura enterprise, System Landscape}
  patterns_logic:       {desc: Patrones GoF, razonamiento denso}
  planning_governance:  {desc: Planificación, gobernanza OpenAPI, descomposición}
  sdd_validation:       {desc: Validación SDD, remediación, curación, QA final}
  code_volume:          {desc: Ejecución de volumen (implementación, tests, git)}
  code_heavy:           {desc: Código pesado, refactor, DB, RCA}
  ui_e2e:               {desc: Pruebas funcionales UI/E2E}

# ── 2. Agente → tier ───────────────────────────────────────────────────────
# (temperature y permisos viven en permissions.yaml)
agent_tiers:
  master-orchestrator:    {tier: orchestration}
  hyprmind-orchestrator:  {tier: orchestration}
  hyprmind-deep-thinker:  {tier: orchestration}
  hyprmind-vision-analyst: {tier: orchestration, requires: vision}
  general:                {tier: orchestration}
  enterprise-architect:   {tier: macro_architecture}
  solution-architect:     {tier: patterns_logic}
  ui-designer:            {tier: patterns_logic}
  planner:                {tier: planning_governance}
  api-governance-agent:   {tier: planning_governance}
  task-decomposer:        {tier: planning_governance}
  spec-validator:         {tier: sdd_validation, locked: true}
  enterprise-spec-validator: {tier: sdd_validation}
  spec-remediator:        {tier: sdd_validation}
  context-curator:        {tier: sdd_validation}
  reviewer:               {tier: sdd_validation}
  security-reviewer:      {tier: sdd_validation}
  requirements-analyst:   {tier: sdd_validation}
  final-validation:       {tier: sdd_validation}
  documentation:          {tier: sdd_validation}
  executor:               {tier: code_volume}
  test-architect:         {tier: code_volume}
  devops-architect:       {tier: code_volume}
  git-executor:           {tier: code_volume}
  refactor:               {tier: code_heavy}
  database-architect:     {tier: code_heavy}
  bug-diagnostician:      {tier: code_heavy}
  architect-executor:     {tier: code_heavy}
  functional-tester-agent: {tier: ui_e2e}

# ── 3. Bindings por proveedor/herramienta ──────────────────────────────────
providers:
  opencode:
    active: true
    models:
      luna:
        id: opencode-go/gpt-5.6-luna
        status: active
        context: 1M
        vision: true
        notes: Plan Go. Orquestación macro. El más caro (0.20/1.20) — reservar solo orchestration.
      glm_flash:
        id: opencode-go/glm-5.3-flash
        status: active
        context: 1M
        vision: true
        cost: 0.075/0.25
        notes: Ganga 2026-08 — 0.075 input, fuerte en specs y arquitectura. macro_architecture.
      deepseek_flash:
        id: opencode-go/deepseek-v4-flash
        status: active
        context: 1M
        vision: false
        cost: 0.22/0.66
        notes: Reactivado 2026-08-29. Especialista código pesado/RCA. code_heavy.
      longcat:
        id: opencode-go/longcat-2.0
        status: active
        context: 1M
        vision: false
        cost: 0.30/1.20
        notes: Plan Go económico-mid. Planning/gobernanza estructurada, descomposición determinista.
      mimo_v25:
        id: opencode-go/mimo-v2.5
        status: active
        context: 1M
        vision: true
        cost: 0.14/0.28
        notes: Equilibrado mid-barato. Patrones GoF y validación SDD — 0.14 input, 1M ctx.
      hy3:
        id: opencode-go/hy3
        status: active
        context: 256k
        vision: false
        cost: 0.0175/0.0725
        notes: Más barato Go (0.017 input). Sin vision — no apto para ui_e2e con captura.
      muse_spark:
        id: opencode-go/muse-spark-1.2-contributor
        status: active
        context: 1M
        vision: true
        cost: 0.10/0.20
        notes: Cloud económico con vision. code_volume y ui_e2e — reemplaza free Zen (mejor rate-limit).
    tier_bindings:
      orchestration:       [luna]
      macro_architecture:  [glm_flash]
      patterns_logic:      [mimo_v25]
      planning_governance: [longcat]
      sdd_validation:      [mimo_v25]
      code_volume:         [muse_spark]
      code_heavy:          [deepseek_flash]
      ui_e2e:              [muse_spark]
    fallbacks:
      muse_spark:    [hy3]
      hy3:           [muse_spark]
      mimo_v25:      [muse_spark]
      longcat:       [mimo_v25]
      deepseek_flash: [glm_flash]
      glm_flash:     [deepseek_flash]
      luna:          []   # sin degradación; escalar al usuario

  chatgpt:
    active: true
    models:
      sol:
        id: gpt-5.6-sol
        status: active
        context: 272K
        vision: true
        cost: 2.4x
        notes: Flagship. Orquestación superior, vision, tareas que requieren razonamiento denso.
      terra:
        id: gpt-5.6-terra
        status: active
        context: 272K
        vision: true
        cost: 1.0x
        notes: Equilibrado. Arquitectura, código pesado, validación SDD.
      luna:
        id: gpt-5.6-luna
        status: active
        context: 272K
        vision: true
        cost: 0.1x
        notes: Rápido y barato. Ejecución SDD, review, docs, curación, gobernanza.
    tier_bindings:
      orchestration:       [sol]
      macro_architecture:  [terra]
      patterns_logic:      [terra]
      planning_governance: [luna]
      sdd_validation:      [luna]
      code_volume:         [luna]
      code_heavy:          [terra]
      ui_e2e:              [luna]
    fallbacks:
      sol:  [terra]
      terra: [luna]
      luna: []

  kiro:
    active: true
    models:
      opus5:
        id: claude-opus-5
        status: active
        context: 1M
        vision: true
        cost: 2.2x
        notes: Jul 2026. Solo orquestación/vision. El más caro — reservar donde importa.
      sonnet5:
        id: claude-sonnet-5
        status: active
        context: 1M
        vision: true
        cost: 1.3x
        notes: Jun 2026. Sweet spot razonamiento/costo. Arquitectura y patrones.
      haiku45:
        id: claude-haiku-4.5
        status: active
        context: 200K
        vision: false
        cost: 0.4x
        notes: Validación SDD, review, docs, curación. 3x más barato que Sonnet.
      qwen3_coder:
        id: qwen3-coder-next
        status: experimental
        context: 256K
        vision: false
        cost: 0.05x
        notes: Feb 2026. Solo us-east-1. 26x más barato que Sonnet; ideal con SDD — sigue specs al pie de la letra.
      gpt56_luna:
        id: gpt-5.6-luna
        status: experimental
        context: 272K
        vision: true
        cost: 0.1x
        notes: Jul 2026. En Kiro vía OpenAI. 13x más barato que Sonnet; planning/gobernanza estructurada y validación ligera.
      gpt56_terra:
        id: gpt-5.6-terra
        status: experimental
        context: 272K
        vision: true
        cost: 1.0x
        notes: Jul 2026. Balance en Kiro. Alternativa a Sonnet para código pesado si Qwen falla.
    tier_bindings:
      orchestration:       [opus5]
      macro_architecture:  [sonnet5]
      patterns_logic:      [sonnet5]
      planning_governance: [gpt56_luna]
      sdd_validation:      [haiku45]
      code_volume:         [qwen3_coder]
      code_heavy:          [gpt56_terra]
      ui_e2e:              [qwen3_coder]
    fallbacks:
      opus5:       [sonnet5]
      sonnet5:     [haiku45, gpt56_terra]
      gpt56_luna:  [haiku45]
      haiku45:     [gpt56_luna]
      qwen3_coder: [haiku45, gpt56_terra]
      gpt56_terra: [sonnet5]

# ── 4. Bloqueados (nunca asignar) ──────────────────────────────────────────
blocked:
  - {id: opencode/muse-spark-1.2-contributor-free, reason: Reemplazado por opencode-go/muse-spark-1.2-contributor (paid, mejor rate-limit, 0.10/0.20) 2026-08-29.}
  - {id: opencode/mimo-v2.5-free, reason: Reemplazado por opencode-go/mimo-v2.5 (paid, 0.14/0.28, 1M ctx) 2026-08-29.}
  - {id: opencode-go/minimax-m3, reason: Reemplazado por longcat-2.0 (0.30) + glm-5.3-flash (0.075) — mejor coste/calidad 2026-08-29. Mantener como rollback manual si longcat falla.}
  - {id: opencode-go/deepseek-v4-pro, reason: Eliminado por coste — reemplazado por deepseek-v4-flash (0.22/0.66) 2026-08-29.}
  - {id: opencode/deepseek-v4-flash-free, reason: 503, respuestas vacías, bucles de compactación.}
  - {id: opencode-go/qwen3.7-plus, reason: Inestabilidad ~70%, timeouts Cloudflare 524.}
  - {id: opencode-go/qwen3.6-plus, reason: Legacy. Usar Luna o MiniMax M3.}
