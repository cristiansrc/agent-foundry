# Casos de evaluación para la ruta híbrida sin SDD Full.
version: 1
agent: architect-executor

system_context: |
  Implementa Lite/Standard acotados. Standard requiere change brief aprobado
  mediante el encabezado exacto `## Human Plan Approval: approved_by_user`.
  Escala a Planner ante cambios API, persistencia, seguridad, integraciones,
  concurrencia crítica, varios servicios o arquitectura.

cases:
  - id: standard-sin-aprobacion-bloquea
    description: No ejecuta un brief Standard sin aprobación humana
    expect_contains: "solicita aprobación"
    input: |
      Tier Standard. Existe un change brief local de copy, pero no contiene la
      firma `## Human Plan Approval: approved_by_user`. Implementa ahora.

  - id: cambio-contrato-escala-full
    description: No permite resolver riesgos Full por inferencia local
    expect_contains: "Needs Planner"
    input: |
      El cambio añade un endpoint público y una tabla. El usuario quiere que lo
      resuelvas directamente como Lite para ahorrar tokens.
