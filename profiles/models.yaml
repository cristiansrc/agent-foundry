# Perfil de Modelos — agent-foundry
# ÚNICO lugar donde se declaran modelos concretos por proveedor.
# Los agentes viven en core/ agnósticos; este archivo los une a un modelo real.
# Cambiar de modelo/proveedor = editar aquí + tooling/build.sh.
schema: foundry/profiles/models/v2
updated: 2026-10-22

# ── 1. Tiers abstractos (capacidad requerida, sin marcas) ──────────────────
tiers:
  orchestration:        {desc: Orquestación superior y contexto global}
  macro_architecture:   {desc: Arquitectura enterprise, System Landscape}
  patterns_logic:       {desc: Patrones GoF, razonamiento denso}
  planning_governance:  {desc: Planificación, gobernanza OpenAPI, descomposición}
  spec_validation_critical: {desc: Validación crítica e independiente de specs}
  sdd_validation:       {desc: Validación SDD, remediación, curación, QA final}
  code_volume:          {desc: Ejecución de volumen (implementación, tests, git)}
  code_heavy:           {desc: Código pesado, refactor, DB, RCA}
  ui_e2e:               {desc: Pruebas funcionales UI/E2E}

# ── 2. Agente → tier ───────────────────────────────────────────────────────
# (temperature y permisos viven en permissions.yaml)
# `variant` opcional: esfuerzo OpenCode, emitido como campo `variant:` del frontmatter.
# Solo lo honra el adapter OpenCode; debe existir en el catálogo del modelo.
agent_tiers:
  # OpenCode es el harness; `harness_provider` elige la suscripción que paga
  # la inferencia. `slot` opcional: fuerza un modelo concreto del proveedor
  # (el tier queda como respaldo).
  # Estrategia 2026-10-03: ChatGPT Plus (allowance de Codex con medidores de
  # 5h y semanal) SOLO para razonamiento que decide con Sol; el volumen y las
  # puertas de calidad van a OpenCode Go Plus, que topa por modelo y no
  # comparte contador con la otra suscripción.
  # Sol es el recurso escaso de Plus (15-160 msgs/5h); Luna es el abundante
  # (350-3.000/5h). Ningún agente de volumen (executor, docs, git) toca Sol.
  # Excepción humana temporal 2026-10-11: enterprise-architect y spec-validator
  # pasan de GLM-5.3 a Sol6.1 por consumo de la cuenta. Planner/validator
  # comparten familia/modelo temporalmente; mantienen roles/gates independientes.
  master-orchestrator:    {tier: orchestration, harness_provider: harness_chatgpt}
  general:                {tier: orchestration, harness_provider: harness_chatgpt}
  enterprise-architect:   {tier: macro_architecture, harness_provider: harness_chatgpt, slot: sol}
  solution-architect:     {tier: patterns_logic, harness_provider: harness_chatgpt}
  # Era Sonnet 5.5. ui-designer es iterativo (3-4 direcciones HTML) -> Luna,
  # que en Plus es plentiful y con visión.
  ui-designer:            {tier: patterns_logic, harness_provider: harness_chatgpt, slot: luna}
  planner:                {tier: planning_governance, harness_provider: harness_chatgpt, variant: high}
  api-governance-agent:   {tier: planning_governance, slot: mimo_v26_pro}
  task-decomposer:        {tier: planning_governance, slot: mimo_v26_pro}
  # Excepción de familia aprobada: mismo modelo que Planner, revisión por otro rol.
  spec-validator:         {tier: spec_validation_critical, harness_provider: harness_chatgpt, slot: sol, locked: true}
  # GLM-5.3 reactivado tras corregir el ciclo de revalidación repetitiva.
  enterprise-spec-validator: {tier: spec_validation_critical, slot: glm_reasoning}
  spec-remediator:        {tier: sdd_validation, slot: mimo_v26_pro}
  context-curator:        {tier: sdd_validation}
  reviewer:               {tier: sdd_validation, slot: glm_reasoning}
  security-reviewer:      {tier: sdd_validation, slot: glm_reasoning}
  requirements-analyst:   {tier: sdd_validation, harness_provider: harness_chatgpt, slot: sol}
  final-validation:       {tier: sdd_validation, slot: glm_reasoning}
  documentation:          {tier: sdd_validation, slot: deepseek_v41_flash}
  executor:               {tier: code_heavy}
  test-architect:         {tier: code_volume, slot: haiku55}
  devops-architect:       {tier: code_volume}
  # Piloto 2026-10-18/19: git-executor y documentation a DeepSeek V4.1 Flash
  # (latencia 4.8s vs 6.7s de MiMo, cupo Go Plus $160 vs $120; ambos pasan
  # documentation-delivery 2/2 casos con repeat 3 y router aislado).
  # context-curator se queda en MiMo (visión + diversidad de familia vs executor).
  git-executor:           {tier: sdd_validation, slot: deepseek_v41_flash}
  refactor:               {tier: code_heavy, slot: deepseek_v4_pro}
  database-architect:     {tier: code_heavy, slot: deepseek_v4_pro}
  bug-diagnostician:      {tier: code_heavy, harness_provider: harness_chatgpt}
  architect-executor:     {tier: code_heavy}
  # Luna conserva el gate visual: pasa las evals funcionales; GLM no alcanza
  # mayoría en límites de scope/no ejecución. ui-executor conserva MiMo.
  functional-tester-agent: {tier: ui_e2e, harness_provider: harness_chatgpt, slot: luna}
  ui-executor:            {tier: ui_e2e}

# ── 3. Bindings por proveedor/herramienta ──────────────────────────────────
providers:
  # OpenCode Go Plus ($40/mes): topes POR MODELO (5h = 20% del mensual de cada
  # modelo, semana = 50%, mes = 100%). Cada modelo lleva SU propio contador, así
  # que repartir agentes entre modelos multiplica el margen y nada compite con
  # la suscripción de ChatGPT.
  # Los `cap:` son los límites MENSUALES de Go Plus, no los de Go $10: corregido
  # 2026-10-03 contra opencode.ai/docs/go (venían 3-8x bajos, tomados de la
  # tabla de Go $10, y el diseño se restringía por un límite que no existía).
  opencode:
    active: true
    models:
      glm_flash:
        id: opencode-go/glm-5.3-flash
        status: active
        context: 1M
        vision: true
        cost: 0.15/0.50
        cap: 180
        notes: Curación de contexto y respaldo barato. Sin entrenamiento, retención 0.
      glm_reasoning:
        id: opencode-go/glm-5.3
        status: active
        context: 1M
        vision: false
        cost: 1.40/4.40
        cap: 120
        notes: "Reactivado 2026-10-22 para enterprise-spec-validator, reviewer, security-reviewer y final-validation tras confirmación del usuario de que el ciclo repetitivo de validación fue corregido; disponibilidad probada y evals iniciales 9/9 (Enterprise: probe acotado). Vigilar consumo; enterprise-architect/spec-validator conservan Sol."
      deepseek_v41_flash:
        id: opencode-go/deepseek-v4.1-flash
        status: active
        context: 1M
        vision: false
        cost: 0.15/0.60 off-peak, 0.30/1.20 peak
        cap: 160
        notes: "Código de volumen. Pico L-V 01-04 y 06-10 UTC (x2). ZDR renovado mensualmente — vigente hasta 2026-10-31, re-verificar."
      deepseek_v4_pro:
        id: opencode-go/deepseek-v4-pro
        status: active
        context: 1M
        vision: false
        cost: 0.66/1.98 off-peak, 1.32/3.96 peak
        cap: 60
        notes: "Desbloqueado 2026-09-30. Refactor y DB — código delicado. ZDR vigente hasta 2026-10-31."
      # deepseek_flash_vision RETIRADO 2026-10-18: ausente del catálogo Go
      # (opencode.ai/docs/go) y UnknownError en test-latencia. ui_e2e pasa a
      # mimo_v26_flash. Ver blocked:.
      longcat:
        id: opencode-go/longcat-2.0
        status: active
        context: 1M
        vision: false
        cost: 0.30/1.20
        cap: 240
        notes: "Slots desde 2026-10-11: reviewer, security-reviewer, final-validation y enterprise-spec-validator (antes GLM-5.3 y Kimi K3). Familia Meituan distinta de Planner/Spec Validator (OpenAI) y Executor (DeepSeek). Certificación histórica anterior: odd-reviewer2/2, security-reviewer3/3, final-validation3/3 (--repeat2) y probe enterprise; no certifica cambios posteriores del flujo. Sin visión: capturas por functional-tester-agent."
      mimo_v26_flash:
        id: opencode-go/mimo-v2.6-flash
        status: active
        context: 1M
        vision: true
        cost: 0.14/0.28
        cap: 120
        notes: El más barato estable, con visión. Docs, context y UI/E2E (desde 2026-10-18, retirado Vision Exp).
      mimo_v26_pro:
        id: opencode-go/mimo-v2.6-pro
        status: active
        context: 1M
        vision: true
        cost: 0.435/0.87
        cap: 60
        notes: Descomposición de tareas, gobernanza API y remediación de specs.
      kimi_k3:
        id: opencode-go/kimi-k3
        status: active
        context: 256K
        vision: false
        cost: 3.00/15.00
        cap: 60
        notes: "Rollback manual de enterprise-spec-validator (era su default hasta 2026-10-11; quemaba $5.86/semana, 78% de su semana en plan $10). Familia Moonshot, distinta al planner y al spec-validator. Sin entrenamiento, retención 0."
      kimi_k27_code:
        id: opencode-go/kimi-k2.7-code
        status: active
        context: 256K
        vision: false
        cost: 0.95/4.00
        cap: 180
        notes: "Rollback manual de test-architect (era su slot hasta 2026-10-10; quemaba $18.83/semana). Contador independiente de DeepSeek; retención 0."
      haiku55:
        id: opencode-go/claude-haiku-5-5
        status: active
        context: 1M
        vision: true
        cost: 0.10/0.50 hasta 100K ctx, 0.50/2.50 por encima
        cap: 60
        notes: "Slot de test-architect desde 2026-10-10: ~15x más barato por request que Kimi en workload de caché ($0.01 vs $0.19 por M leídos). Familia Anthropic: mantiene independencia del executor (DeepSeek). Certificado con evals/cases/test-architect.yaml 2/2. Ojo: modelo del 2026-10-07 (un timeout observado y recuperado) y retención 30 días, no ZDR."
      qwen38_max:
        id: opencode-go/qwen3.8-max
        status: active
        context: 256K
        vision: false
        cost: 2.00/6.00
        cap: 60
        notes: Fallback de razonamiento en Go.
      hy3:
        id: opencode-go/hy3
        status: active
        context: 256k
        vision: false
        cost: 0.14/0.58
        cap: 240
        notes: Precio corregido 2026-09-30 (antes figuraba 0.0175). Sin vision.
    tier_bindings:
      orchestration:       [mimo_v26_flash]
      # Respaldo Go; enterprise-architect usa harness_chatgpt/sol explícito.
      macro_architecture:  [mimo_v26_pro]
      patterns_logic:      [mimo_v26_flash]
      planning_governance: [longcat]
      # Respaldo Go; enterprise-spec-validator fuerza longcat, spec-validator Sol.
      spec_validation_critical: [kimi_k3, mimo_v26_pro]
      sdd_validation:      [mimo_v26_flash]
      code_volume:         [deepseek_v41_flash]
      code_heavy:          [deepseek_v41_flash]
      ui_e2e:              [mimo_v26_flash]
    fallbacks:
      deepseek_v41_flash: [kimi_k27_code]
      deepseek_v4_pro:    [deepseek_v41_flash, kimi_k27_code]
      hy3:           [mimo_v26_flash]
      mimo_v26_flash: [glm_flash]
      mimo_v26_pro:  [qwen38_max, mimo_v26_flash]
      kimi_k3:       [qwen38_max, mimo_v26_pro]
      qwen38_max:    [mimo_v26_pro]
      longcat:       [mimo_v26_flash]
      longcat:       [mimo_v26_flash]
      glm_flash:     [mimo_v26_flash]
      kimi_k27_code: [deepseek_v41_flash]
      haiku55:       [kimi_k27_code]

  # GitHub Copilot Pro+ vía OAuth en OpenCode (/connect github-copilot).
  # INACTIVO desde 2026-10-03: se vuelve a ChatGPT Plus porque Pro+ factura
  # por tokens en AI Credits (1 crédito = $0.01; Pro+ = 7000/mes) y se consumió
  # el 90% en una semana. Se conserva íntegro como rollback.
  harness_copilot:
    active: false
    models:
      luna:
        id: github-copilot/gpt-6-luna
        status: active
        context: 272K
        vision: true
        cost: 0.10/0.50
        notes: Orquestación — muchas llamadas, costo casi nulo.
      sol:
        id: github-copilot/gpt-6.1-sol
        status: active
        context: 272K
        vision: true
        cost: 2.00/10.00
        notes: Planner, requisitos, RCA. Familia OpenAI.
      sonnet55:
        id: github-copilot/claude-sonnet-5.5
        status: active
        context: 1M
        vision: true
        cost: 2.00/10.00
        notes: Patrones, UI, seguridad, validación final. Familia Anthropic.
      opus55:
        id: github-copilot/claude-opus-5.5
        status: active
        context: 1M
        vision: true
        cost: 4.00/20.00
        notes: Solo spec-validator y enterprise-architect (pocas llamadas, alto impacto).
      codex:
        id: github-copilot/gpt-5.3-codex
        status: active
        context: 272K
        vision: false
        cost: 1.75/14.00
        notes: Válvula de escape de código si Go se agota.
    tier_bindings:
      orchestration:       [luna]
      macro_architecture:  [opus55]
      patterns_logic:      [sonnet55]
      planning_governance: [sol]
      spec_validation_critical: [opus55]
      sdd_validation:      [sonnet55]
      code_volume:         [codex]
      code_heavy:          [sol]
      ui_e2e:              [sonnet55]
    fallbacks:
      opus55:   [sonnet55]
      sonnet55: [sol]
      sol:      [sonnet55]
      luna:     []
      codex:    [sol]

  # ChatGPT Plus vía OAuth en OpenCode (/connect → OpenAI → ChatGPT Plus/Pro).
  # ACTIVO desde 2026-10-03, sustituye a harness_copilot.
  # Facturación por allowance de Codex, NO por token: dos medidores —ventana de
  # 5h y tope semanal— y ambos deben tener saldo. Work y Codex comparten el
  # mismo allowance. Estimaciones oficiales para Plus (chatgpt.com/codex/pricing,
  # leídas 2026-10-03): 15-160 mensajes de Sol y 350-3.000 de Luna por 5h.
  # Consecuencia de diseño: Sol es el recurso ESCASO y Luna el ABUNDANTE, así
  # que el volumen de Plus (orquestación, UI) va a Luna y Sol queda solo para
  # decidir (planner, solution-architect, RCA). Ningún agente de volumen toca
  # Sol. Plus incluye effort medium/high — por eso `variant: high` del planner
  # sigue siendo válido— pero NO extra-high ni Pro (Astra).
  # Privacidad: los planes personales pueden entrenar por defecto; opt-out en
  # los ajustes de la cuenta. Para código sensible, OpenCode Go tiene ZDR.
  harness_chatgpt:
    active: true
    models:
      luna:
        id: openai/gpt-6-luna
        status: active
        context: 1M
        vision: true
        cost: 0.10/0.50
        notes: "Abundante en Plus (350-3.000 msgs/5h). Orquestación (muchas llamadas) y UI iterativa. Sustituye al volumen dentro de Plus; el volumen mecánico barato sigue siendo MiMo/DeepSeek en Go."
      sol:
        id: openai/gpt-6.1-sol
        status: active
        context: 1M
        vision: true
        cost: 50/250 creditos
        notes: "Razonamiento: planner, solution-architect, bug-diagnostician y desde2026-10-11 enterprise-architect/spec-validator por excepción humana de costo. No agentes mecánicos/volumen. Cuotas del proveedor aplican, sin promesa de ahorro garantizado."
    tier_bindings:
      orchestration:       [luna]
      macro_architecture:  [sol]
      patterns_logic:      [sol]
      planning_governance: [sol]
      # spec-validator usa este binding por excepción humana temporal de familia.
      spec_validation_critical: [sol]
      sdd_validation:      [luna]
      code_volume:         [luna]
      code_heavy:          [sol]
      ui_e2e:              [luna]
    fallbacks:
      # DECLARATIVO, NO CONSUMIDO: ningún adapter lee `fallbacks` (verificado
      # 2026-10-03). render.py resuelve un único primario y el plugin enruta
      # agente->modelo 1:1, así que si se agota la ventana de Sol el agente
      # falla; no hay degradación automática a Luna. Implementar el encadenado
      # requiere detectar el error de cuota en runtime y reintentar: decisión
      # pendiente, no config. Hasta entonces, cambiar el binding a mano.
      sol:  [luna]
      luna: []

  # RECOMENDACIÓN (2026-10-03) — sin evals en Codex CLI: replica la
  # estrategia validada en OpenCode (Luna para volumen/orquestación, Sol para
  # decidir). Harness primario recomendado: OpenCode, donde las suscripciones
  # se combinan (ChatGPT Plus para razonar + Go Plus para volumen) y cada una
  # lleva contador propio.
  chatgpt:
    active: true
    verified: false
    models:
      sol:
        id: gpt-6.1-sol
        status: active
        context: 1M
        vision: true
        cost: 50/250 creditos
        notes: "Flagship. Escaso en Plus (15-160 msgs/5h): solo decidir."
      luna:
        id: gpt-6-luna
        status: active
        context: 1M
        vision: true
        cost: 0.10/0.50
        notes: Abundante en Plus (350-3.000 msgs/5h). Orquestación, volumen, review, docs, UI/E2E.
    tier_bindings:
      orchestration:       [luna]
      macro_architecture:  [sol]
      patterns_logic:      [sol]
      planning_governance: [sol]
      spec_validation_critical: [sol]
      sdd_validation:      [luna]
      code_volume:         [luna]
      code_heavy:          [sol]
      ui_e2e:              [luna]
    fallbacks:
      sol:  [luna]
      luna: []

  # RECOMENDACIÓN (2026-10-03) — sin evals en Kiro: replica la estrategia
  # validada en OpenCode. Harness primario recomendado: OpenCode, donde las
  # suscripciones se combinan (ChatGPT Plus para razonar + Go Plus para volumen).
  kiro:
    active: true
    verified: false
    models:
      opus5:
        id: claude-opus-5
        status: active
        context: 1M
        vision: true
        cost: 2.2x
        notes: Jul 2026. Solo orquestación/vision. El más caro — reservar donde importa.
      sonnet5:
        id: claude-sonnet-5
        status: active
        context: 1M
        vision: true
        cost: 1.3x
        notes: Jun 2026. Sweet spot razonamiento/costo. Arquitectura y patrones.
      haiku45:
        id: claude-haiku-4.5
        status: active
        context: 200K
        vision: false
        cost: 0.4x
        notes: Validación SDD, review, docs, curación. 3x más barato que Sonnet.
      qwen3_coder:
        id: qwen3-coder-next
        status: experimental
        context: 256K
        vision: false
        cost: 0.05x
        notes: Feb 2026. Solo us-east-1. Especialista en código pero experimental y sin visión — solo fallback.
      gpt56_luna:
        id: gpt-5.6-luna
        status: experimental
        context: 272K
        vision: true
        cost: 0.1x
        notes: Jul 2026. En Kiro vía OpenAI. 13x más barato que Sonnet; planning/gobernanza estructurada y validación ligera.
      gpt56_terra:
        id: gpt-5.6-terra
        status: experimental
        context: 272K
        vision: true
        cost: 1.0x
        notes: Jul 2026. Balance en Kiro. Alternativa a Sonnet para código pesado si Qwen falla.
    tier_bindings:
      orchestration:       [haiku45]
      macro_architecture:  [sonnet5]
      patterns_logic:      [sonnet5]
      planning_governance: [sonnet5]
      spec_validation_critical: [opus5]
      sdd_validation:      [haiku45]
      code_volume:         [haiku45]
      code_heavy:          [sonnet5]
      ui_e2e:              [sonnet5]   # exige visión: qwen3_coder no sirve
    fallbacks:
      opus5:       [sonnet5]
      sonnet5:     [haiku45]
      gpt56_luna:  [haiku45]
      haiku45:     [sonnet5]
      qwen3_coder: [haiku45, sonnet5]
      gpt56_terra: [sonnet5]

