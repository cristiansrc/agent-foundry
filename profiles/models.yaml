      haiku45:
        id: claude-haiku-4.5
        status: active
        context: 200K
        vision: false
        cost: 0.4x
        notes: Validación SDD, review, docs, curación. 3x más barato que Sonnet.
      qwen3_coder:
        id: qwen3-coder-next
        status: experimental
        context: 256K
        vision: false
