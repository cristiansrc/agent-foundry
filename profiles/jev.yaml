# Configuración del selector Jev. Las claves viven fuera del repositorio.
schema: foundry/profiles/jev/v1

active_provider: vercel
model: typesafe-ai/jev
api_key_env: AI_GATEWAY_API_KEY
timeout_ms: 30000

providers:
  vercel:
    base_url: https://ai-gateway.vercel.sh/v1/evaluate
    model: typesafe-ai/jev
    api_key_env: AI_GATEWAY_API_KEY
  typesafe:
    base_url: https://thejevai.com/v1/systemone
    model: jev-latest
    api_key_env: JEV_API_KEY

confidence:
  auto_route: 0.80
  confirm: 0.60

dynamic_agents:
  - planner
  - solution-architect
  - enterprise-architect
  - bug-diagnostician
  - security-reviewer
  - final-validation

reasoning_bindings:
  # Solo un proveedor por nivel: el render itera en orden y el último en
  # escribir gana, así que declarar dos proveedores para el mismo nivel haría
  # el resultado dependiente del orden del YAML.
  # harness_copilot queda inactivo desde 2026-10-03 (rollback). Al desactivarlo
  # sin tocar este bloque, reasoning_models se vaciaba en el build y el plugin
  # se quedaba sin niveles.
  harness_chatgpt:
    low: luna
    medium: luna
    high: sol
    critical: sol
