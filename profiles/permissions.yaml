# Permisos y parámetros de ejecución por agente
# Valores abstractos; cada adapter los mapea a su formato nativo.
# extraido fielmente de config-ai el 2026-08-22.
schema: foundry/profiles/permissions/v1

defaults:
  mode: all
  edit: deny
  bash: deny

agents:
  # ── Workers ──────────────────────────────────────────────────────────────
  executor:               {edit: allow, bash: allow, temp: "0.15"}
  architect-executor:     {edit: allow, bash: allow, temp: "0.15"}
  database-architect:     {edit: allow, bash: allow, temp: "0.10"}
  devops-architect:       {edit: allow, bash: allow, temp: "0.2"}
  refactor:               {edit: allow, bash: allow, temp: "0.2"}
  documentation:          {edit: allow, bash: deny, temp: "0.25"}
  spec-remediator:        {edit: allow, bash: deny, temp: "0.1"}
  functional-tester-agent: {edit: allow, bash: allow, temp: "0.2"}
  git-executor:           {edit: allow, bash: allow, temp: "0.1"}

  # ── Consultants ──────────────────────────────────────────────────────────
  requirements-analyst:   {edit: allow, bash: deny, temp: "0.3"}
  planner:                {edit: allow, bash: deny, temp: "0.2"}
  solution-architect:     {edit: allow, bash: deny, temp: "0.2"}
  enterprise-architect:   {edit: allow, bash: deny, temp: "0.2"}
  test-architect:         {edit: allow, bash: allow, temp: "0.2"}
  task-decomposer:        {edit: allow, bash: deny, temp: "0.2"}
  context-curator:        {edit: deny, bash: deny, temp: "0.10"}
  master-orchestrator:    {edit: deny, bash: deny, execute: allow, temp: "0.15"}

  # ── Validators ───────────────────────────────────────────────────────────
  spec-validator:         {edit: allow, bash: deny, temp: "0.1"}
  enterprise-spec-validator: {edit: allow, bash: deny, temp: "0.1"}
  api-governance-agent:   {edit: deny, bash: allow, temp: "0.10"}
  bug-diagnostician:      {edit: deny, bash: allow, temp: "0.10"}
  reviewer:               {edit: deny, bash: allow, temp: "0.1"}
  security-reviewer:      {edit: deny, bash: allow, temp: "0.1"}
  final-validation:       {edit: deny, bash: allow, temp: "0.1"}

  # ── Guardrails / Personal ────────────────────────────────────────────────
  general:                {mode: subagent, edit: deny, bash: deny, temp: "0.1"}
  hyprmind-orchestrator:  {temp: "0.8"}
  hyprmind-deep-thinker:  {temp: "0.5"}
  hyprmind-vision-analyst: {temp: "0.2"}
